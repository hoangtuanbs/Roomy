name: Deploy website

# Uploads website/ to Cloudflare Pages whenever it changes on main (or on a manual run).
# The Pages project is created on the first run if it doesn't exist yet, so don't also connect the repository
# in the Cloudflare dashboard: a project made here is a "Direct Upload" project and Actions deploys it.
#
# Secrets it needs (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN    an API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   your account ID (Cloudflare dashboard > Workers & Pages, right-hand side)
# Optional secrets, copied into the Pages project for the contact form (see website/README.md):
#   RESEND_API_KEY, CONTACT_TO, CONTACT_FROM, TURNSTILE_SECRET
# Optional variable: CLOUDFLARE_PAGES_PROJECT (default roomydisk, served at roomydisk.pages.dev).
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/deploy-website.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy-website:
    runs-on: avrea-macos-latest
    environment:
      name: website
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'roomydisk' }}
      # Pinned so a new Wrangler release can't change a deploy without a commit here.
      WRANGLER: npx --yes wrangler@4.20.0
    steps:
      - name: Check the Cloudflare secrets are set
        run: |
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if (( ${#missing[@]} )); then
            echo "::error::Add these secrets to deploy the website: ${missing[*]} (see the top of deploy-website.yml)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create the Pages project if it doesn't exist
        run: |
          if $WRANGLER pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            echo "Pages project $PROJECT exists."
          else
            $WRANGLER pages project create "$PROJECT" --production-branch main
          fi

      - name: Copy the contact form's secrets into the Pages project
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          CONTACT_FROM: ${{ secrets.CONTACT_FROM }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          # Only the ones set here; anything set in the Cloudflare dashboard instead is left alone.
          for name in RESEND_API_KEY CONTACT_TO CONTACT_FROM TURNSTILE_SECRET; do
            if [[ -n "${!name}" ]]; then
              printf '%s' "${!name}" | $WRANGLER pages secret put "$name" --project-name "$PROJECT" > /dev/null
              echo "Set $name"
            fi
          done

      - name: Deploy
        id: deploy
        working-directory: website
        run: |
          # Run from website/ so functions/ (the contact form) is deployed with the pages.
          $WRANGLER pages deploy . --project-name "$PROJECT" --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s | cut -c1-300)" \
            | tee "$RUNNER_TEMP/deploy.log"
          echo "url=https://$PROJECT.pages.dev" >> "$GITHUB_OUTPUT"
          echo "Deployed to https://$PROJECT.pages.dev" >> "$GITHUB_STEP_SUMMARY"
