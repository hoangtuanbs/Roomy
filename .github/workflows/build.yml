name: Build

on:
  push:
    branches: [main]
    # The website is static files served by Cloudflare Pages; it needs no Mac build.
    paths-ignore: ['website/**']
  pull_request:
    paths-ignore: ['website/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: avrea-macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build all products
        run: swift build

      - name: Run tests
        run: swift test

      - name: Build the app bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Benchmark the scanner
        # Times a scan of two big folders on the build machine (release build), with and without the APFS clone
        # checks, and prints the item counts and peak memory. Read-only.
        run: |
          swift build -c release --product roomy-scan
          bin="$(swift build -c release --show-bin-path)/roomy-scan"
          for folder in /Applications /usr; do "$bin" --benchmark "$folder"; done

      - name: Check the bundle
        run: |
          codesign --verify --deep --strict build/RoomyDisk.app
          plutil -lint build/RoomyDisk.app/Contents/Info.plist
          test -f build/RoomyDisk.app/Contents/Resources/AppIcon.icns

      - name: Check the translations
        run: |
          shopt -s nullglob
          files=(build/RoomyDisk.app/Contents/Resources/*.lproj/Localizable.strings)
          test ${#files[@]} -gt 0 || { echo "::error::No Localizable.strings in the bundle"; exit 1; }
          plutil -lint "${files[@]}"

      - name: Launch the app and check it stays up
        run: |
          build/RoomyDisk.app/Contents/MacOS/RoomyDisk > "$RUNNER_TEMP/launch.log" 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::RoomyDisk quit or crashed within 20 seconds of launch"
            cat "$RUNNER_TEMP/launch.log"
            exit 1
          fi
          echo "RoomyDisk is still running after 20 seconds"
          kill "$pid"

      - name: Run the app flow tests
        # Drives the real models and sheets end to end (Sources/Roomy/FlowTest.swift) in a sandbox under $RUNNER_TEMP:
        # the app's home folder, settings, scan cache and cleanup history all point into it, and its safety rules block
        # everything outside it. Files it moves to the Trash are put back into the sandbox; the Trash is never emptied.
        run: |
          sandbox="$RUNNER_TEMP/flow"
          rm -rf "$sandbox"
          home="$sandbox/home"
          mkdir -p "$home/Movies" "$home/Downloads" "$home/Projects/app" "$home/Pictures"
          mkfile 30m "$home/Movies/holiday.mov"
          cp "$home/Movies/holiday.mov" "$home/Downloads/holiday copy.mov"
          mkfile 12m "$home/Projects/app/build.dmg"
          mkfile 4m "$home/Projects/app/notes.txt"
          # Two sizes of one picture, for Similar photos in Space Hunters.
          picture=$(find "/System/Library/Desktop Pictures" -maxdepth 2 \( -name "*.heic" -o -name "*.jpg" \) 2>/dev/null | head -1)
          if [ -n "$picture" ]; then
            sips -s format jpeg -Z 2400 "$picture" --out "$home/Pictures/beach.jpg" > /dev/null || true
            sips -s format jpeg -Z 1600 "$picture" --out "$home/Pictures/beach small.jpg" > /dev/null || true
          fi
          app=build/RoomyDisk.app/Contents/MacOS/RoomyDisk

          # Runs the app in flow test mode with a time limit; prints its output and returns its status.
          flow() {
            local limit=$1 log=$2
            shift 2
            "$app" "$@" > "$log" 2>&1 &
            local pid=$! status=0
            for i in $(seq 1 "$limit"); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            if kill -0 "$pid" 2>/dev/null; then
              echo "::error::The flow tests did not finish within $limit seconds"
              kill "$pid"
              status=124
            fi
            wait "$pid" || status=$?
            cat "$log"
            return "$status"
          }

          status=0
          flow 300 "$RUNNER_TEMP/flow.log" --flow-test "$sandbox" || status=$?
          echo "--- Vietnamese ---"
          flow 120 "$RUNNER_TEMP/flow-vi.log" -AppleLanguages '(vi)' --flow-test "$sandbox" --flow-only localization || status=$?
          if grep -h "^flow: FAIL" "$RUNNER_TEMP/flow.log" "$RUNNER_TEMP/flow-vi.log"; then
            echo "::error::Some app flow tests failed"
            exit 1
          fi
          grep -q "^flow: PASS localization" "$RUNNER_TEMP/flow-vi.log" || { echo "::error::The Vietnamese check did not run"; exit 1; }
          if [ "$status" -ne 0 ]; then
            echo "::error::The flow tests exited with status $status"
            exit 1
          fi
          echo "Passed: $(grep -c '^flow: PASS' "$RUNNER_TEMP/flow.log") scenarios"

      - name: Take screenshots of the main screens
        run: |
          sample="$RUNNER_TEMP/sample"
          mkdir -p "$sample/Photos" "$sample/Projects/app" "$sample/Downloads"
          mkfile 30m "$sample/Photos/holiday.mov"
          cp "$sample/Photos/holiday.mov" "$sample/Downloads/holiday copy.mov"
          # An APFS clone of the film, which shares its space with it.
          cp -c "$sample/Photos/holiday.mov" "$sample/Photos/holiday clone.mov"
          mkfile 12m "$sample/Projects/app/build.dmg"
          mkfile 4m "$sample/Projects/app/notes.txt"
          # Two sizes of one picture, for Similar photos in Space Hunters.
          picture=$(find "/System/Library/Desktop Pictures" -maxdepth 2 \( -name "*.heic" -o -name "*.jpg" \) 2>/dev/null | head -1)
          if [ -n "$picture" ]; then
            sips -s format jpeg -Z 2400 "$picture" --out "$sample/Photos/beach.jpg" > /dev/null || true
            sips -s format jpeg -Z 1600 "$picture" --out "$sample/Photos/beach small.jpg" > /dev/null || true
          fi
          out="$RUNNER_TEMP/screenshots"
          build/RoomyDisk.app/Contents/MacOS/RoomyDisk --scan "$sample" --tour "$out" &
          pid=$!
          for i in $(seq 1 180); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::The screenshot tour did not finish within 3 minutes"
            kill "$pid"
            exit 1
          fi
          wait "$pid" || { echo "::error::RoomyDisk exited with an error during the tour"; exit 1; }
          ls -l "$out"
          count=$(ls "$out"/*.png 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -lt 17 ]; then
            echo "::error::Expected 17 screenshots, got $count (is there a window session on this runner?)"
            exit 1
          fi

      - name: Take Vietnamese screenshots of the main view and Smart Clean
        # The same tour in Vietnamese (the app follows -AppleLanguages), to check the translated screens.
        run: |
          sample="$RUNNER_TEMP/sample"
          out="$RUNNER_TEMP/screenshots-vi"
          build/RoomyDisk.app/Contents/MacOS/RoomyDisk -AppleLanguages '(vi)' --scan "$sample" --tour "$out" &
          pid=$!
          for i in $(seq 1 180); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::The Vietnamese screenshot tour did not finish within 3 minutes"
            kill "$pid"
            exit 1
          fi
          wait "$pid" || { echo "::error::RoomyDisk exited with an error during the Vietnamese tour"; exit 1; }
          cp "$out/1-main-treemap.png" "$RUNNER_TEMP/vi-1-main-treemap.png"
          cp "$out/3-smart-clean.png" "$RUNNER_TEMP/vi-3-smart-clean.png"

      - name: Print small copies of the screenshots
        # Artifact downloads need a blob storage host that some reviewers can't reach; the job log can be read.
        if: always()
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/screenshots/*.png; do
            small="$RUNNER_TEMP/small-$(basename "$f" .png).jpg"
            sips -Z 1000 -s format jpeg -s formatOptions 70 "$f" --out "$small" > /dev/null
            echo "=== BEGIN $(basename "$small")"
            base64 -i "$small" | fold -w 4000
            echo "=== END $(basename "$small")"
          done

      - name: Print the Vietnamese screenshots
        if: always()
        run: |
          for name in vi-1-main-treemap vi-3-smart-clean; do
            f="$RUNNER_TEMP/$name.png"
            [ -f "$f" ] || continue
            small="$RUNNER_TEMP/small-$name.jpg"
            sips -Z 1000 -s format jpeg -s formatOptions 70 "$f" --out "$small" > /dev/null
            echo "=== BEGIN $name.jpg"
            base64 -i "$small" | fold -w 4000
            echo "=== END $name.jpg"
          done

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoomyDisk-screenshots-${{ github.run_number }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: RoomyDisk-build-${{ github.run_number }}
          path: build/RoomyDisk.zip
          retention-days: 14
